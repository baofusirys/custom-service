name: Promote Version to Aliyun ACR

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing immutable GHCR version to copy, without leading v
        required: true
        type: string

permissions:
  contents: read
  packages: read

env:
  GHCR_REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
  ALIYUN_NAMESPACE: ${{ secrets.ALIYUN_NAMESPACE }}

jobs:
  promote:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - cs-backend
          - cs-admin
          - cs-widget
          - cs-nginx
          - cs-mysql
          - cs-redis
          - cs-coturn
    steps:
      - name: Validate immutable version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version format" >&2
            exit 2
          fi
          if [[ -z "${ALIYUN_REGISTRY}" || -z "${ALIYUN_NAMESPACE}" ]]; then
            echo "Aliyun ACR registry configuration is missing" >&2
            exit 3
          fi

      - name: Set lowercase owner
        id: meta
        run: echo "owner_lc=$(echo '${{ env.OWNER }}' | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Copy amd64 image without unsupported attestations
        env:
          VERSION: ${{ inputs.version }}
          IMAGE: ${{ matrix.image }}
          OWNER_LC: ${{ steps.meta.outputs.owner_lc }}
        run: |
          set -euo pipefail
          SRC="${GHCR_REGISTRY}/${OWNER_LC}/${IMAGE}:${VERSION}"
          DST="${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/${IMAGE}:${VERSION}"
          docker pull --platform linux/amd64 "$SRC"
          SOURCE_IMAGE_ID=$(docker image inspect --format '{{.Id}}' "$SRC")
          docker tag "$SRC" "$DST"
          docker push "$DST"
          TARGET_IMAGE_ID=$(docker image inspect --format '{{.Id}}' "$DST")
          test "$SOURCE_IMAGE_ID" = "$TARGET_IMAGE_ID"
          echo "Promoted ${IMAGE}:${VERSION}; image_id=${SOURCE_IMAGE_ID}"
