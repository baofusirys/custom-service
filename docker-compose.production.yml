name: custom-service

# ============================================================
# 生产部署专用 docker-compose（用 GHCR 预编译镜像，不在本机编译）
# ============================================================
# 用法（不 clone 仓库，2 个文件 5 分钟跑起来）：
#   curl -fsSL https://raw.githubusercontent.com/baofusirys/custom-service/main/docker-compose.production.yml -o docker-compose.yml
#   curl -fsSL https://raw.githubusercontent.com/baofusirys/custom-service/main/.env.example -o .env
#   vim .env  # 改 PUBLIC_DOMAIN / ACME_EMAIL / 6 个密码 / TURN_EXTERNAL_IP
#   docker compose pull && docker compose up -d
#
# 升级（pull 新镜像 + 重启，不编译）：
#   docker compose pull && docker compose up -d
#
# 【国内源加速】拉 ghcr.io 慢时，在 .env 里设 REGISTRY_BASE 指向阿里云 ACR：
#   REGISTRY_BASE=crpi-saarj7fitzff243d.cn-zhangjiakou.personal.cr.aliyuncs.com/baofusir
#   （阿里云个人版 ACR 的镜像已设为公开，匿名直接 pull，无需 docker login）
#   docker compose pull && docker compose up -d
#   不设 REGISTRY_BASE 时默认用 ghcr.io/baofusirys（国外）。镜像名 cs-* 两边一致。
#
# 跟开发版 docker-compose.yml 区别：
#   - 所有 build: 改为带明确版本的 image；IMAGE_TAG 默认等于当前发布版本，禁止 latest 漂移
#   - 不需要源码，纯运维操作
# 想从源码自己 build？用 docker-compose.yml（开发版，docker compose up -d --build）
# ============================================================

services:

  mysql:
    image: ${REGISTRY_BASE:-ghcr.io/baofusirys}/cs-mysql:${IMAGE_TAG:-0.7.2}
    container_name: cs-mysql
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - cs_mysql_data:/var/lib/mysql
    networks: [cs-net]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: ${REGISTRY_BASE:-ghcr.io/baofusirys}/cs-redis:${IMAGE_TAG:-0.7.2}
    container_name: cs-redis
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - cs_redis_data:/data
    networks: [cs-net]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    image: ${REGISTRY_BASE:-ghcr.io/baofusirys}/cs-backend:${IMAGE_TAG:-0.7.2}
    container_name: cs-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      DATA_AES_KEY: ${DATA_AES_KEY}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      ENABLE_HTTPS: ${ENABLE_HTTPS}
      BACKEND_HTTP_PORT: ${BACKEND_HTTP_PORT:-8080}
      BACKEND_LOG_LEVEL: ${BACKEND_LOG_LEVEL:-info}
      BACKEND_MAX_UPLOAD_MB: ${BACKEND_MAX_UPLOAD_MB:-20}
      SECURITY_IP_HTTP_RPM: ${SECURITY_IP_HTTP_RPM:-60}
      SECURITY_IP_WS_HANDSHAKE_PM: ${SECURITY_IP_WS_HANDSHAKE_PM:-5}
      SECURITY_VISITOR_MSG_PM: ${SECURITY_VISITOR_MSG_PM:-10}
      SECURITY_IP_BLACKLIST_THRESHOLD: ${SECURITY_IP_BLACKLIST_THRESHOLD:-200}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-admin}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD}
      TURN_REALM: ${TURN_REALM}
      TURN_STATIC_AUTH_SECRET: ${TURN_STATIC_AUTH_SECRET}
      TURN_LISTEN_PORT: ${TURN_LISTEN_PORT:-3478}
      TURN_TLS_PORT: ${TURN_TLS_PORT:-5349}
      # [119] 多人大厅（LiveKit）：未设置 LIVEKIT_API_KEY 时大厅整体关闭，原有功能不受影响
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_INTERNAL_URL: ${LIVEKIT_INTERNAL_URL:-http://cs-livekit:7880}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-}
    volumes:
      - ${HOST_DATA_DIR:-/srv/cs-data}/logs/backend:/app/logs
      - ${HOST_DATA_DIR:-/srv/cs-data}/uploads:/app/uploads
    networks: [cs-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  admin:
    image: ${REGISTRY_BASE:-ghcr.io/baofusirys}/cs-admin:${IMAGE_TAG:-0.7.2}
    container_name: cs-admin
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    networks: [cs-net]

  widget:
    image: ${REGISTRY_BASE:-ghcr.io/baofusirys}/cs-widget:${IMAGE_TAG:-0.7.2}
    container_name: cs-widget
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    networks: [cs-net]

  coturn:
    image: ${REGISTRY_BASE:-ghcr.io/baofusirys}/cs-coturn:${IMAGE_TAG:-0.7.2}
    container_name: cs-coturn
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP}
      TURN_REALM: ${TURN_REALM}
      TURN_STATIC_AUTH_SECRET: ${TURN_STATIC_AUTH_SECRET}
      TURN_LISTEN_PORT: ${TURN_LISTEN_PORT:-3478}
      TURN_TLS_PORT: ${TURN_TLS_PORT:-5349}
      TURN_MIN_PORT: ${TURN_MIN_PORT:-50000}
      TURN_MAX_PORT: ${TURN_MAX_PORT:-50200}
    volumes:
      - cs_ssl_data:/etc/coturn/ssl-src:ro
      - ${HOST_DATA_DIR:-/srv/cs-data}/logs/coturn:/var/log/coturn

  # ============================================================
  # [119] 多人大厅媒体服务（自托管 LiveKit v1.13.10，镜像以 UID 10001 非 root 运行）
  #   - 信令 7880 只在容器内网：cs-nginx 反代 /lk/rtc，后端走 http://cs-livekit:7880（不写 ports）
  #   - 媒体 7881/tcp、7882/udp 必须对公网开放（云安全组同步放行）；宿主端口必须与容器端口一致，
  #     因为 ICE 候选里通告的就是 NODE_IP + 这两个端口，不能像 [044] 那样改成别的宿主端口
  #   - 密钥只走环境变量：入口脚本由 LIVEKIT_API_KEY / LIVEKIT_API_SECRET 组装 LIVEKIT_KEYS，不打印任何值
  #   - NODE_IP 复用 TURN_EXTERNAL_IP（服务器公网 IP），缺失或格式不对时容器拒绝启动
  #   - 两个密钥都未设置：大厅关闭，本容器待机（不监听端口、不重启刷屏）
  # ============================================================
  livekit:
    image: ${REGISTRY_BASE:-ghcr.io/baofusirys}/cs-livekit:${IMAGE_TAG:-0.7.2}
    container_name: cs-livekit
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      NODE_IP: ${TURN_EXTERNAL_IP:-}
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
    networks: [cs-net]
    mem_limit: 512m
    cpus: "1.0"
    security_opt:
      - "no-new-privileges:true"
    cap_drop: [ALL]
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      # 官方镜像为 alpine，busybox wget 探测 http://127.0.0.1:7880/（健康时 200 "OK"）
      test: ["CMD", "/usr/local/bin/cs-livekit-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  nginx:
    image: ${REGISTRY_BASE:-ghcr.io/baofusirys}/cs-nginx:${IMAGE_TAG:-0.7.2}
    container_name: cs-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      admin:
        condition: service_started
      widget:
        condition: service_started
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      ENABLE_HTTPS: ${ENABLE_HTTPS:-true}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ${HOST_DATA_DIR:-/srv/cs-data}/logs/nginx:/var/log/nginx
      - cs_ssl_data:/etc/nginx/ssl
      - cs_acme_data:/opt/acme.sh
    networks: [cs-net]

volumes:
  cs_mysql_data:
    name: cs_mysql_data
  cs_redis_data:
    name: cs_redis_data
  cs_ssl_data:
    name: cs_ssl_data
  cs_acme_data:
    name: cs_acme_data

networks:
  cs-net:
    name: cs-net
    driver: bridge
