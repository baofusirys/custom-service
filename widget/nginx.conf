server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;

  # iframe 内页面可被任意页面 <iframe> 包含
  add_header X-Frame-Options "" always;

  # ─────────────────────────────────────────────────────────────────────
  # 关键：loader.js / chat.html 是 widget 的入口文件，更新频繁。
  # 用 no-cache 让浏览器**每次都向服务器验证**（带 If-None-Match / If-Modified-Since）：
  #   - 文件没变 → 服务器 304，浏览器用本地缓存，零下载开销
  #   - 文件有变 → 服务器 200 + 新内容，浏览器立即拿到新版
  # 这样部署新版 widget 后用户不用清缓存就能拿到。
  # 注意 nginx add_header 的继承陷阱：location 内一旦写了 add_header，server 级的 add_header
  # 全部不再继承，所以每个 location 都要重新声明 nosniff。
  # ─────────────────────────────────────────────────────────────────────
  location = /loader.js {
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  # [119] 访客窗口 CSP：
  #   - script-src 'self'：chat.js / hall-core.js / hall.js / vendor/livekit-client 全部同源外链，无内联脚本
  #   - connect-src：同源 HTTP 接口、同源 wss（/ws/ 访客实时连接、/lk/ LiveKit 信令）；
  #     'self' 在新浏览器里已覆盖同源 ws/wss，wss://$host 兼容只按 scheme 匹配的旧版 Safari
  #   - media-src 'self' blob:：大厅音视频（LiveKit 以 MediaStream 播放）与提示音
  #   - worker-src 'self' blob:：预留给 livekit-client 的可选 Worker，禁止跨域 Worker
  #   - frame-ancestors *：挂件需要被任意第三方站点嵌入（与主 nginx /widget/ 规则一致）
  # 主 nginx（nginx/conf.d/_upstream.inc 的 location /widget/）另有一条 CSP，浏览器按两者交集执行。
  location = /chat.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(self), autoplay=(self), clipboard-write=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss://$host; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors *" always;
  }
  # [119] 挂件业务脚本：与入口一样每次验证，部署后立即生效
  location ~ ^/(chat|hall|hall-core)\.js$ {
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  # [119] 第三方固定版本文件（文件名带版本号、内容不可变）：一年强缓存
  location ^~ /vendor/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
  }

  # 禁止把源码、构建配置、备份和数据库转储通过 SPA fallback 返回。
  location ~* /(\.env|requirements\.txt|Dockerfile|docker-compose[^/]*|.*\.(?:sql|dump|bak|backup|tar|gz|zip|pem|key|map))$ {
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
  # 其他静态资源（图片、字体等）保留长缓存
  location ~* \.(?:css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  gzip on;
  gzip_types text/plain text/css application/javascript text/javascript image/svg+xml;
  gzip_min_length 512;
}
