<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线客服</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; background: #f7f8fa;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI",
      "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #2c3034;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }

  #app { display: flex; flex-direction: column; height: 100%; }

  /* ========== 顶部栏 ========== */
  header {
    height: 60px; flex-shrink: 0;
    background: linear-gradient(135deg, #4a90ff 0%, #2974ff 100%);
    color: #fff; display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; box-shadow: 0 2px 8px rgba(41,116,255,.18);
    position: relative; z-index: 2;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .header-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255,255,255,.22); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 600; flex-shrink: 0;
  }
  .header-text { display: flex; flex-direction: column; line-height: 1.2; }
  .header-title { font-size: 15px; font-weight: 600; }
  .header-status { font-size: 12px; opacity: .9; display: flex; align-items: center; gap: 4px; margin-top: 2px; }
  .dot {
    width: 7px; height: 7px; border-radius: 50%; background: #4ade80;
    box-shadow: 0 0 0 2px rgba(74,222,128,.3);
  }
  .dot.off { background: #f87171; box-shadow: 0 0 0 2px rgba(248,113,113,.3); }
  .close-btn {
    width: 28px; height: 28px; border-radius: 6px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: #fff; opacity: .85; transition: background .15s, opacity .15s;
  }
  .close-btn:hover { background: rgba(255,255,255,.16); opacity: 1; }

  /* ========== 消息区 ========== */
  #list {
    flex: 1; overflow-y: auto; padding: 14px 14px 8px;
    background: #f7f8fa;
    scroll-behavior: smooth;
  }
  #list::-webkit-scrollbar { width: 6px; }
  #list::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
  #list::-webkit-scrollbar-thumb:hover { background: #9ca3af; }

  .time-divider {
    text-align: center; margin: 14px 0 10px;
    font-size: 11px; color: #9ca3af; user-select: none;
  }
  .time-divider span {
    background: #e5e7eb; padding: 3px 12px; border-radius: 10px;
  }

  /* 系统提示（chip） */
  .sys-chip {
    margin: 10px auto; max-width: 82%;
    background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa;
    padding: 6px 12px; border-radius: 14px; font-size: 12px;
    text-align: center; line-height: 1.5;
  }

  /* [113] 撤回占位：系统样式灰色小字（行内替换气泡或整行居中） */
  .recall-tip {
    margin: 6px auto; max-width: 82%;
    color: #9ca3af; font-size: 12px; line-height: 1.5;
    text-align: center; user-select: none;
  }
  /* [113] 客服正在输入：位于消息列表与输入区之间 */
  .typing-tip {
    flex-shrink: 0; padding: 2px 16px 6px;
    background: #f7f8fa; color: #9ca3af; font-size: 12px; line-height: 1.5;
    user-select: none;
  }

  /* ========== 消息组 ========== */
  .msg-group { margin-bottom: 4px; }

  .msg-line {
    display: flex; align-items: flex-end;
    gap: 10px;            /* 头像与气泡间距 */
    margin-top: 8px;      /* 不同组之间的间距 */
    padding: 0 2px;
  }
  .msg-line.mine { flex-direction: row-reverse; }

  .msg-avatar {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; color: #fff;
    background: #94a3b8;
    box-shadow: 0 1px 2px rgba(15,23,42,.06);
  }
  .msg-avatar.agent { background: linear-gradient(135deg, #4a90ff 0%, #2974ff 100%); }
  .msg-avatar.visitor { background: linear-gradient(135deg, #94a3b8 0%, #64748b 100%); }

  /*
   * msg-stack 关键设计：
   *   - align-items: flex-start/end 让每条气泡按自己的内容宽度自适应
   *     （短消息窄、长消息宽，互不影响）—— 修复了"新消息撑开旧消息"的 Bug
   *   - max-width 限制整组不超出可视区域
   */
  .msg-stack {
    display: flex; flex-direction: column;
    gap: 3px;
    max-width: calc(100% - 54px);   /* 留出头像 34px + gap 10px + 余量 */
    min-width: 0;
    align-items: flex-start;
  }
  .msg-line.mine .msg-stack { align-items: flex-end; }

  /* ========== 气泡 ========== */
  .bubble {
    position: relative;             /* 给 .bubble-copy 用 */
    display: inline-block;          /* 关键：宽度跟随内容 */
    max-width: 100%;
    padding: 9px 14px;
    border-radius: 18px;
    line-height: 1.55;
    word-break: break-word; white-space: pre-wrap;
    font-size: 14px;
    box-shadow: 0 1px 2px rgba(15,23,42,.04);
  }
  .msg-line.mine .bubble {
    background: linear-gradient(135deg, #4a90ff 0%, #2974ff 100%);
    color: #fff;
  }
  .msg-line.theirs .bubble {
    background: #fff; color: #2c3034;
    border: 1px solid #e5e7eb;
  }
  /* 消息复制按钮：默认 opacity:0，hover 气泡时出现 */
  .bubble-copy {
    position: absolute; top: 4px; right: 4px;
    width: 22px; height: 22px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 5px;
    opacity: 0; transition: opacity .15s, background .15s;
    cursor: pointer;
    color: #94a3b8; background: rgba(255,255,255,.85);
  }
  .bubble:hover .bubble-copy,
  .bubble:active .bubble-copy { opacity: 1; }    /* 移动端 touch 也能显示 */
  .bubble-copy:hover { background: rgba(0,0,0,.06); color: #2974ff; }
  .msg-line.mine .bubble-copy { color: #e0ecff; background: rgba(255,255,255,.18); }
  .msg-line.mine .bubble-copy:hover { background: rgba(255,255,255,.32); color: #fff; }
  .bubble-copy--done { background: #10b981 !important; color: #fff !important; opacity: 1 !important; }

  /* ====== 图片 lightbox（点聊天消息里的图片全屏放大查看） ====== */
  .img-lightbox {
    position: fixed; inset: 0; z-index: 99999;
    background: rgba(0,0,0,.88);
    display: flex; align-items: center; justify-content: center;
    cursor: zoom-out;
    animation: img-lightbox-fade .15s ease-out;
  }
  @keyframes img-lightbox-fade { from { opacity: 0; } to { opacity: 1; } }
  .img-lightbox img {
    max-width: 92vw; max-height: 92vh;
    object-fit: contain; cursor: auto;
    box-shadow: 0 8px 32px rgba(0,0,0,.5);
    border-radius: 4px;
  }
  .img-lightbox-close {
    position: absolute; top: 12px; right: 20px;
    color: #fff; font-size: 36px; line-height: 1;
    cursor: pointer; user-select: none;
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; background: rgba(255,255,255,.12);
    transition: background .15s;
  }
  .img-lightbox-close:hover { background: rgba(255,255,255,.24); }

  /* ====== 语音通话浮窗 ====== */
  .voice-panel {
    position: absolute; inset: 0;
    z-index: 50;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: linear-gradient(160deg, #1e3a8a 0%, #2974ff 100%);
    color: #fff; padding: 20px;
    animation: voice-fade-in .25s ease-out;
  }
  @keyframes voice-fade-in {
    from { opacity: 0; transform: scale(.95); }
    to   { opacity: 1; transform: scale(1); }
  }
  .voice-panel .voice-icon {
    width: 88px; height: 88px; border-radius: 50%;
    background: rgba(255,255,255,.18);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 18px;
    animation: voice-pulse 1.6s ease-in-out infinite;
  }
  @keyframes voice-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,.35); }
    50%      { box-shadow: 0 0 0 18px rgba(255,255,255,0); }
  }
  .voice-panel.voice-panel--talking .voice-icon { animation: none; background: rgba(16,185,129,.25); }
  .voice-panel.voice-panel--ended .voice-icon  { animation: none; background: rgba(255,255,255,.12); }
  .voice-target { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  .voice-status { font-size: 14px; opacity: .85; margin-bottom: 32px; }
  .voice-hang {
    width: 60px; height: 60px; border-radius: 50%; border: none;
    background: #ef4444; color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(239,68,68,.45);
    transition: background .15s, transform .1s;
  }
  .voice-hang:hover { background: #dc2626; }
  .voice-hang:active { transform: scale(.95); }
  .voice-panel.voice-panel--ended .voice-hang { display: none; }
  #voiceRemoteAudio { display: none; }


  /* 同组多条气泡的"chain" 视觉：
   *   - 非最后一条：靠头像那侧的下角小圆角，连接下一条
   *   - 最后一条：靠头像那侧的下角变成"尾巴"
   */
  .msg-line.mine .bubble:not(:last-child) { border-bottom-right-radius: 6px; }
  .msg-line.theirs .bubble:not(:last-child) { border-bottom-left-radius: 6px; }
  .msg-line.mine .bubble:last-child { border-bottom-right-radius: 5px; }
  .msg-line.theirs .bubble:last-child { border-bottom-left-radius: 5px; }

  /* 图片气泡：边距收紧，让图片自身做主 */
  .bubble.bubble-image {
    padding: 4px;
    border-radius: 14px;
  }
  .bubble.bubble-image .img-msg {
    display: block;
    max-width: 220px; max-height: 220px;
    border-radius: 10px; cursor: pointer;
  }

  /* 已读 / 未读 角标 */
  .read-indicator {
    font-size: 11px; color: #9ca3af;
    margin: 3px 2px 0 0;
    user-select: none;
  }

  /* 文件卡片 */
  .file-card {
    display: inline-flex; align-items: center; gap: 10px;
    text-decoration: none; color: inherit;
    min-width: 180px;
  }
  .file-card .ico {
    width: 36px; height: 36px; border-radius: 8px;
    background: rgba(255,255,255,.2); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .msg-line.theirs .file-card .ico { background: #eff6ff; color: #2974ff; }
  .file-card .meta { display: flex; flex-direction: column; min-width: 0; }
  .file-card .name {
    font-size: 13px; font-weight: 500;
    max-width: 170px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .file-card .sub { font-size: 11px; opacity: .75; margin-top: 2px; }

  /* ========== 底部输入 ========== */
  footer {
    flex-shrink: 0; background: #fff; border-top: 1px solid #e5e7eb;
    padding: 10px 12px;
  }
  .input-wrap {
    background: #f3f4f6; border-radius: 10px; padding: 8px 10px;
    transition: background .15s, box-shadow .15s;
  }
  /* [039]/[040] 粘贴/选附件后的多文件预览队列：先放这里，点发送才依次上传 */
  .pending-list {
    display: none; flex-wrap: wrap; gap: 6px;
    margin-bottom: 6px;
  }
  .pending-list.is-show { display: flex; }
  .pending-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: #fff; border: 1px solid #e5e7eb; border-radius: 8px;
    padding: 4px 6px; max-width: 180px; min-height: 36px;
  }
  .pending-chip img.thumb {
    width: 36px; height: 36px; object-fit: cover; border-radius: 5px; flex-shrink: 0;
  }
  .pending-chip .file-icon {
    width: 30px; height: 30px; border-radius: 5px; background: #eef4ff;
    color: #2974ff; display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .pending-chip .meta { flex: 1; min-width: 0; overflow: hidden; }
  .pending-chip .name {
    font-size: 12px; color: #2c3034; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .pending-chip .size { font-size: 10px; color: #9ca3af; margin-top: 1px; }
  .pending-chip .remove-btn {
    width: 20px; height: 20px; border-radius: 50%; border: 0; cursor: pointer;
    background: #f3f4f6; color: #6b7280; font-size: 13px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .pending-chip .remove-btn:hover { background: #fee2e2; color: #dc2626; }
  .input-wrap:focus-within {
    background: #fff;
    box-shadow: 0 0 0 2px rgba(74,144,255,.2);
  }
  textarea {
    width: 100%; resize: none; border: 0; outline: none;
    background: transparent; font: inherit; color: #2c3034;
    min-height: 38px; max-height: 100px; line-height: 1.5;
    padding: 0;
  }
  textarea::placeholder { color: #9ca3af; }
  .actions {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 4px;
  }
  .icon-btn {
    width: 32px; height: 32px; border-radius: 8px; border: 0; cursor: pointer;
    background: transparent; color: #6b7280;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s;
  }
  .icon-btn:hover { background: #f3f4f6; color: #2974ff; }
  /* 语音按钮 pill 样式（图标 + 文字横排），区别于纯图标按钮 */
  .voice-btn-pill {
    height: 32px; padding: 0 10px 0 8px;
    border-radius: 16px; border: 0; cursor: pointer;
    background: #eef4ff; color: #2974ff;
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; line-height: 1; font-weight: 500;
    margin-left: 6px;
    transition: background .15s, color .15s;
  }
  .voice-btn-pill:hover { background: #dbeafe; }
  .voice-btn-hint { white-space: nowrap; }
  .send-btn {
    border: 0; cursor: pointer; height: 32px; padding: 0 16px;
    border-radius: 8px; font: inherit; font-size: 13px; font-weight: 500;
    background: linear-gradient(135deg, #4a90ff 0%, #2974ff 100%);
    color: #fff; transition: opacity .15s, transform .05s;
  }
  .send-btn:hover { opacity: .92; }
  .send-btn:active { transform: scale(.97); }
  .send-btn:disabled { background: #d1d5db; cursor: not-allowed; }

  /* ==================================================================
   * [119] 多人大厅：页签 + 大厅页（配色与组件沿用上方私聊样式）
   * ================================================================== */
  [hidden] { display: none !important; }
  .tabs {
    height: 40px; flex-shrink: 0; display: flex;
    background: #fff; border-bottom: 1px solid #e5e7eb;
    position: relative; z-index: 1;
  }
  .tab {
    flex: 1; border: 0; background: transparent; cursor: pointer;
    font: inherit; font-size: 13px; color: #6b7280;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    position: relative; transition: color .15s;
  }
  .tab:hover { color: #2974ff; }
  .tab[aria-selected="true"] { color: #2974ff; font-weight: 600; }
  .tab[aria-selected="true"]::after {
    content: ''; position: absolute; left: 30%; right: 30%; bottom: 0;
    height: 2px; border-radius: 2px; background: #2974ff;
  }
  .tab-count { font-size: 11px; font-weight: 400; color: #9ca3af; }
  .tab-dot { width: 7px; height: 7px; border-radius: 50%; background: #ef4444; flex-shrink: 0; }

  .pane { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }

  .hall-bar {
    flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 6px 12px; background: #fff; border-bottom: 1px solid #f1f2f4;
    font-size: 12px; color: #6b7280;
  }
  .hall-bar-status { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .hall-bar-status span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hall-chip-btn {
    height: 26px; padding: 0 10px 0 8px; border-radius: 13px; border: 1px solid #e5e7eb;
    background: #fff; color: #4b5563; cursor: pointer; font: inherit; font-size: 12px;
    display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0;
    transition: background .15s, color .15s, border-color .15s;
  }
  .hall-chip-btn:hover { color: #2974ff; border-color: #c7dbff; }
  .hall-chip-btn.is-on { background: #fef2f2; color: #dc2626; border-color: #fecaca; }
  .hall-btn-ico { display: inline-flex; }
  .hall-btn-ico svg { width: 15px; height: 15px; }

  /* 参与者条：横向滚动 */
  .hall-people {
    flex-shrink: 0; display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden;
    padding: 8px 12px 6px; background: #fff; border-bottom: 1px solid #e5e7eb;
    scrollbar-width: thin;
  }
  .hall-people::-webkit-scrollbar { height: 4px; }
  .hall-people::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }
  .hp {
    position: relative; width: 52px; flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .hp-av {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #94a3b8 0%, #64748b 100%); color: #fff;
    font-size: 13px; font-weight: 600;
    transition: box-shadow .15s;
  }
  .hp.is-agent .hp-av { background: linear-gradient(135deg, #4a90ff 0%, #2974ff 100%); }
  .hp.is-speaking .hp-av { box-shadow: 0 0 0 2px #fff, 0 0 0 4px #10b981; }
  .hp-mic {
    position: absolute; top: 22px; left: 50%; margin-left: 6px;
    height: 16px; min-width: 16px; padding: 0 2px; border-radius: 8px;
    background: #fff; color: #9ca3af; box-shadow: 0 1px 2px rgba(15,23,42,.15);
    display: inline-flex; align-items: center; justify-content: center; gap: 1px;
  }
  .hp-mic svg { width: 10px; height: 10px; }
  .hp.is-mic-on .hp-mic { color: #10b981; }
  .hp-name {
    max-width: 52px; font-size: 11px; color: #4b5563; line-height: 1.3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hp.is-self .hp-name { color: #2974ff; }
  .hp-more {
    justify-content: center; height: 34px; border-radius: 17px; width: 40px;
    background: #f3f4f6; color: #6b7280; font-size: 12px;
  }

  /* 视频网格：最多 2 路远端 + 本地预览 */
  .hall-video {
    flex-shrink: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px;
    padding: 8px 12px; background: #111827;
  }
  .hv-tile { position: relative; aspect-ratio: 16 / 9; background: #1f2937; border-radius: 8px; overflow: hidden; }
  .hv-tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hv-tile.is-local video { transform: scaleX(-1); }
  .hv-name {
    position: absolute; left: 6px; bottom: 4px; max-width: calc(100% - 12px);
    padding: 1px 6px; border-radius: 4px; background: rgba(0,0,0,.5); color: #fff; font-size: 11px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* 提示条（点击收听 / 已在其他页面收听 / 被移出 / 已满） */
  .hall-notice {
    flex-shrink: 0; display: flex; align-items: center; gap: 8px;
    margin: 8px 12px 0; padding: 8px 10px; border-radius: 10px;
    background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; font-size: 12px; line-height: 1.5;
  }
  .hall-notice[data-kind="listen"] { background: #eef4ff; color: #1d4ed8; border-color: #c7dbff; }
  .hall-notice-text { flex: 1; min-width: 0; }
  .hall-notice-btn {
    flex-shrink: 0; height: 28px; padding: 0 12px; border: 0; border-radius: 14px; cursor: pointer;
    background: linear-gradient(135deg, #4a90ff 0%, #2974ff 100%); color: #fff; font: inherit; font-size: 12px; font-weight: 500;
  }

  /* 消息区 */
  .hall-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 12px; background: #f7f8fa; position: relative; }
  .hall-scroll::-webkit-scrollbar { width: 6px; }
  .hall-scroll::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
  .hall-privacy {
    display: flex; align-items: flex-start; gap: 6px; margin: 0 0 8px;
    padding: 7px 10px; border-radius: 8px; background: #eef4ff; color: #3b5b99; font-size: 12px; line-height: 1.5;
  }
  .hall-privacy svg { flex-shrink: 0; margin-top: 1px; }
  .hall-link-btn { border: 0; background: none; padding: 0; color: #2974ff; font: inherit; cursor: pointer; text-decoration: underline; }
  .hall-more {
    display: block; margin: 0 auto 8px; height: 26px; padding: 0 12px; border-radius: 13px;
    border: 1px solid #e5e7eb; background: #fff; color: #6b7280; font: inherit; font-size: 12px; cursor: pointer;
  }
  .hall-new {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 104px; z-index: 3;
    height: 28px; padding: 0 14px; border-radius: 14px; border: 0; cursor: pointer;
    background: #2974ff; color: #fff; font: inherit; font-size: 12px; box-shadow: 0 4px 12px rgba(41,116,255,.3);
  }
  .hm { display: flex; align-items: flex-start; gap: 8px; margin-top: 10px; }
  .hm.hm-mine { flex-direction: row-reverse; }
  .hm-av {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #94a3b8 0%, #64748b 100%); color: #fff; font-size: 12px; font-weight: 600;
  }
  .hm-av.agent { background: linear-gradient(135deg, #4a90ff 0%, #2974ff 100%); }
  .hm-body { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; min-width: 0; max-width: calc(100% - 46px); }
  .hm.hm-mine .hm-body { align-items: flex-end; }
  .hm-meta { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #9ca3af; max-width: 100%; }
  .hm.hm-mine .hm-meta { flex-direction: row-reverse; }
  .hm-name { color: #6b7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
  .hm-badge { padding: 0 5px; border-radius: 4px; background: #eef4ff; color: #2974ff; font-size: 10px; line-height: 16px; }
  .hm-bubble {
    display: inline-block; max-width: 100%; padding: 8px 12px; border-radius: 14px; border-top-left-radius: 4px;
    background: #fff; border: 1px solid #e5e7eb; color: #2c3034;
    font-size: 14px; line-height: 1.55; word-break: break-word; white-space: pre-wrap;
  }
  .hm.hm-agent .hm-bubble { background: #f0f6ff; border-color: #d6e6ff; }
  .hm.hm-mine .hm-bubble {
    border: 0; border-top-left-radius: 14px; border-top-right-radius: 4px;
    background: linear-gradient(135deg, #4a90ff 0%, #2974ff 100%); color: #fff;
  }
  .hm-bubble-img { padding: 4px; }
  .hm-img {
    display: block; max-width: 200px; max-height: 200px; min-width: 60px; min-height: 40px;
    border-radius: 10px; cursor: zoom-in; background: #e5e7eb; object-fit: cover;
  }
  .hm-text { display: block; }
  .hm-bubble-img .hm-text { padding: 4px 6px 2px; }
  .hm-file { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: inherit; min-width: 160px; }
  .hm-file-ico {
    width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center; background: #eef4ff; color: #2974ff;
  }
  .hm.hm-mine .hm-file-ico { background: rgba(255,255,255,.2); color: #fff; }
  .hm-file-meta { display: flex; flex-direction: column; min-width: 0; }
  .hm-file-name { font-size: 13px; font-weight: 500; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hm-file-sub { font-size: 11px; opacity: .75; }
  .hm-state { font-size: 11px; color: #9ca3af; }
  .hm-state.is-failed { color: #dc2626; }
  .hm-resend { border: 0; background: none; padding: 0; color: #2974ff; font: inherit; cursor: pointer; text-decoration: underline; }
  .hm.hm-system { justify-content: center; }
  .hm-sys {
    max-width: 86%; padding: 4px 12px; border-radius: 12px; background: #e5e7eb; color: #6b7280;
    font-size: 12px; text-align: center; word-break: break-word;
  }

  .hall-toast {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 104px; z-index: 4;
    max-width: calc(100% - 32px); padding: 8px 14px; border-radius: 10px;
    background: rgba(17,24,39,.9); color: #fff; font-size: 12px; line-height: 1.5; text-align: center;
    box-shadow: 0 6px 18px rgba(15,23,42,.25); pointer-events: none;
  }

  .hall-tools { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .hall-media-btn {
    height: 32px; padding: 0 10px 0 8px; border-radius: 16px; border: 0; cursor: pointer;
    background: #f3f4f6; color: #4b5563; font: inherit; font-size: 12px; font-weight: 500; line-height: 1;
    display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
    transition: background .15s, color .15s, opacity .15s;
  }
  .hall-media-btn:hover { background: #e8eaee; color: #2974ff; }
  .hall-media-btn.is-on { background: #ecfdf5; color: #059669; }
  .hall-media-btn.is-busy, .hall-media-btn:disabled { opacity: .55; cursor: not-allowed; }
  .send-btn:disabled, .icon-btn:disabled { opacity: .55; cursor: not-allowed; }
  textarea:disabled { cursor: not-allowed; }

  /* 窄屏 / 矮屏适配 */
  @media (max-width: 360px) {
    .hall-media-label, .hall-chip-label { display: none; }
    .hall-media-btn { padding: 0 8px; }
    .hall-chip-btn { padding: 0 7px; }
    .hall-bar, .hall-scroll, .hall-people, .hall-video { padding-left: 8px; padding-right: 8px; }
    .hm-img { max-width: 160px; max-height: 160px; }
  }
  @media (max-height: 520px) {
    .hall-people { padding-top: 4px; padding-bottom: 4px; }
    .hp-name { display: none; }
    .hp-mic { top: 20px; }
    .hall-video { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
  <div id="app">
    <header>
      <div class="header-left">
        <div class="header-avatar" id="hAvatar">客</div>
        <div class="header-text">
          <span class="header-title">在线客服</span>
          <span class="header-status"><span class="dot" id="dot"></span><span id="status">连接中…</span></span>
        </div>
      </div>
      <div class="close-btn" id="closeBtn" title="收起">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </div>
    </header>

    <!-- [119] 页签：大厅 / 私聊客服（hall.js 确认大厅开启后显示，默认大厅；未启用大厅时只显示私聊） -->
    <nav class="tabs" id="tabs" role="tablist" aria-label="会话类型" hidden>
      <button class="tab" id="tabHall" type="button" role="tab" aria-selected="false" aria-controls="hallPane">大厅<span class="tab-count" id="tabHallCount"></span><span class="tab-dot" id="tabHallDot" hidden></span></button>
      <button class="tab" id="tabPrivate" type="button" role="tab" aria-selected="true" aria-controls="privatePane">私聊客服<span class="tab-dot" id="tabPrivateDot" hidden></span></button>
    </nav>

    <!-- [119] 多人大厅页（逻辑见 hall.js） -->
    <section class="pane hall-pane" id="hallPane" role="tabpanel" aria-labelledby="tabHall" hidden>
      <div class="hall-bar">
        <div class="hall-bar-status">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span id="hallStatusText">正在进入大厅…</span>
        </div>
        <button class="hall-chip-btn" id="hallMuteBtn" type="button" aria-pressed="false" title="静音大厅（只影响本机播放）"><span class="hall-btn-ico"></span><span class="hall-chip-label" id="hallMuteLabel">静音大厅</span></button>
      </div>
      <div class="hall-people" id="hallPeople" aria-label="大厅成员" hidden></div>
      <div class="hall-video" id="hallVideo" aria-label="大厅视频" hidden></div>
      <div class="hall-notice" id="hallNotice" role="status" aria-live="polite" hidden>
        <span class="hall-notice-text" id="hallNoticeText"></span>
        <button class="hall-notice-btn" id="hallNoticeBtn" type="button" hidden></button>
      </div>
      <div class="hall-scroll" id="hallScroll">
        <div class="hall-privacy">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span>大厅消息所有人可见，订单号、账号等隐私请到<button class="hall-link-btn" id="hallGoPrivate" type="button">私聊客服</button></span>
        </div>
        <button class="hall-more" id="hallMore" type="button" hidden>查看更早的消息</button>
        <div id="hallMsgs"></div>
      </div>
      <button class="hall-new" id="hallNewBtn" type="button" hidden></button>
      <div class="hall-toast" id="hallToast" role="alert" hidden></div>
      <footer>
        <div class="input-wrap">
          <div id="hallPendingList" class="pending-list"></div>
          <textarea id="hallInput" maxlength="1000" placeholder="在大厅发言，所有人可见；回车发送"></textarea>
        </div>
        <div class="actions">
          <div class="hall-tools">
            <button class="icon-btn" id="hallFileBtn" type="button" title="发送图片 / 文件">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            </button>
            <input type="file" id="hallFileInput" multiple hidden>
            <button class="hall-media-btn" id="hallMicBtn" type="button" aria-pressed="false" disabled><span class="hall-btn-ico"></span><span class="hall-media-label" id="hallMicLabel">开麦</span></button>
            <button class="hall-media-btn" id="hallCamBtn" type="button" aria-pressed="false" hidden disabled><span class="hall-btn-ico"></span><span class="hall-media-label" id="hallCamLabel">摄像头</span></button>
          </div>
          <button class="send-btn" id="hallSendBtn" type="button">发送</button>
        </div>
      </footer>
      <!-- 远端大厅音频挂载点（挂件收起时也继续播放） -->
      <div id="hallAudioSink" hidden></div>
    </section>

    <!-- 私聊客服页（原有一对一会话，结构与逻辑不变） -->
    <section class="pane" id="privatePane" role="tabpanel" aria-labelledby="tabPrivate">
      <div id="list"></div>

      <footer>
        <div class="input-wrap">
          <!-- [039]/[040] 多文件预览队列：默认隐藏，addPendingFile 时显示 -->
          <div id="pendingList" class="pending-list"></div>
          <textarea id="input" placeholder="输入消息，回车发送，Shift+回车换行"></textarea>
        </div>
        <div class="actions">
          <div>
            <button class="icon-btn" id="fileBtn" title="发送附件 / 图片">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
              </svg>
            </button>
            <input type="file" id="fileInput" multiple style="display:none">
            <button class="voice-btn-pill" id="voiceBtn" title="语音通话">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
              </svg>
              <span class="voice-btn-hint" id="voiceBtnHint">直接呼叫客服</span>
            </button>
          </div>
          <button class="send-btn" id="sendBtn">发送</button>
        </div>
      </footer>
    </section>

    <!-- 语音通话浮窗（覆盖在 widget 顶部，呼叫中/通话中显示） -->
    <div id="voicePanel" class="voice-panel" style="display:none">
      <div class="voice-icon">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
      </div>
      <div class="voice-target">客服</div>
      <div class="voice-status">拨号中...</div>
      <button class="voice-hang" id="voiceHangBtn" title="挂断">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/>
          <line x1="22" y1="2" x2="2" y2="22"/>
        </svg>
      </button>
      <!-- 远端音频流挂载点，autoplay 在用户点击「呼叫」手势之后允许 -->
      <audio id="voiceRemoteAudio" autoplay playsinline></audio>
    </div>
  </div>

<!-- [119] 大厅模块须先于 chat.js 执行（defer 按书写顺序执行）；livekit-client 由 hall.js 空闲时按需加载 -->
<script src="hall-core.js" defer></script>
<script src="hall.js" defer></script>
<script src="/chat.js" defer></script>
</body>
</html>
